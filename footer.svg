<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="r"><rect width="1000" height="140" rx="20"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a1038"/><stop offset=".5" stop-color="#7a1f52"/><stop offset="1" stop-color="#4a0c32"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
.tw{animation:tw 2.4s steps(2) infinite}
.fl{animation:fl 4.5s steps(9) infinite}
.drift{animation:dr 10s ease-in-out infinite alternate}
