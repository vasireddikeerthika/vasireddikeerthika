@keyframes fl{0%{transform:translateY(8px);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes dr{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
